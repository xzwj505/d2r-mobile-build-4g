name: Build iPhone 13 Optimized IPA

on:
  workflow_dispatch:
    inputs:
      ipa_variant:
        description: "IPA 架构版本 (iPhone 13 必选 ios18)"
        required: true
        default: "ios18"
        type: choice
        options:
          - ios18
          - ios26

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Locate & Download Latest Base IPA
        env:
          VARIANT: ${{ inputs.ipa_variant }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p base_ipa extracted_ipa outputs
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/jiayx/d2r-mobile-build/releases?per_page=15" > base_ipa/releases.json

          if [ "$VARIANT" = "ios18" ]; then
            DOWNLOAD_URL=$(jq -r '[.[] | .assets[] | select(.name | endswith("-ios18.ipa")) | .browser_download_url][0]' base_ipa/releases.json)
            TAG=$(jq -r '[.[] | select(any(.assets[]; .name | endswith("-ios18.ipa"))) | .tag_name][0]' base_ipa/releases.json)
          else
            DOWNLOAD_URL=$(jq -r '[.[] | .assets[] | select((.name | endswith(".ipa")) and (.name | endswith("-ios18.ipa") | not)) | .browser_download_url][0]' base_ipa/releases.json)
            TAG=$(jq -r '[.[] | select(any(.assets[]; (.name | endswith(".ipa")) and (.name | endswith("-ios18.ipa") | not))) | .tag_name][0]' base_ipa/releases.json)
          fi

          echo "$TAG" > base_ipa/tag.txt
          curl -fL --retry 3 -o "base_ipa/base.ipa" "$DOWNLOAD_URL"
          unzip -q "base_ipa/base.ipa" -d extracted_ipa

      - name: 3. Compile & In-Place Re-Export Inject (0-Byte Header Growth, 0 Code Overwrite)
        env:
          VARIANT: ${{ inputs.ipa_variant }}
        run: |
          set -euxo pipefail
          APP_DIR=$(find extracted_ipa/Payload -maxdepth 1 -name "*.app" | head -n 1)
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p "$APP_DIR/Frameworks"

          cat << 'EOF' > iphone13_universal_opt.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <Metal/Metal.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #include <malloc/malloc.h>
          #include <pthread.h>
          #include <unistd.h>

          // 1. 仅对纯渲染目标 (排除 PixelFormatView 与 ShaderWrite) 开启 A15 硬件无损帧缓冲压缩
          static id<MTLTexture> (*orig_newTex)(id, SEL, MTLTextureDescriptor *);
          static id<MTLTexture> swizzled_newTex(id self, SEL _cmd, MTLTextureDescriptor *desc) {
              if (!desc || !orig_newTex) return orig_newTex ? orig_newTex(self, _cmd, desc) : nil;
              if (desc.storageMode == MTLStorageModePrivate) {
                  if (desc.usage == MTLTextureUsageShaderRead) {
                      desc.hazardTrackingMode = MTLHazardTrackingModeUntracked;
                  } else if ((desc.usage & MTLTextureUsageRenderTarget) != 0 &&
                             (desc.usage & (MTLTextureUsagePixelFormatView | MTLTextureUsageShaderWrite)) == 0) {
                      MTLTextureCompressionType oldComp = desc.compressionType;
                      @try {
                          desc.compressionType = MTLTextureCompressionTypeLossless;
                          id<MTLTexture> t = orig_newTex(self, _cmd, desc);
                          if (t) return t;
                      } @catch (NSException *e) {}
                      desc.compressionType = oldComp;
                  }
              }
              return orig_newTex(self, _cmd, desc);
          }

          // 2. 对齐 A15 (iPhone 13 Pro Max) 30 FPS 官方稳帧基准，锁定 30Hz 整除刷新 (1.85W)
          static void (*orig_metal_setRange)(id, SEL, CAFrameRateRange);
          static void swizzled_metal_setRange(id self, SEL _cmd, CAFrameRateRange range) {
              (void)range;
              if (orig_metal_setRange) {
                  orig_metal_setRange(self, _cmd, CAFrameRateRangeMake(30, 30, 30));
              }
          }

          static void (*orig_ca_setRange)(id, SEL, CAFrameRateRange);
          static void swizzled_ca_setRange(id self, SEL _cmd, CAFrameRateRange range) {
              (void)range;
              if (orig_ca_setRange) {
                  orig_ca_setRange(self, _cmd, CAFrameRateRangeMake(30, 30, 30));
              }
          }

          // 3. 将交换链从 3 缓冲降为 2 (双缓冲)，立省一帧全屏视网膜显存并降低延迟
          static void (*orig_setMaxDrawables)(id, SEL, NSUInteger);
          static void swizzled_setMaxDrawables(id self, SEL _cmd, NSUInteger count) {
              if (count > 2) count = 2;
              if (orig_setMaxDrawables) orig_setMaxDrawables(self, _cmd, count);
          }

          // 4. 每 3 秒归还 C 标准库已释放的空闲堆缓存页
          static void *heap_relief_thread(void *arg) {
              (void)arg;
              while (1) {
                  sleep(3);
                  malloc_zone_pressure_relief(NULL, 0);
              }
              return NULL;
          }

          __attribute__((constructor))
          static void init_iphone13_v5_opt(void) {
              @autoreleasepool {
                  id<MTLDevice> dev = MTLCreateSystemDefaultDevice();
                  if (dev) {
                      Class devCls = object_getClass(dev);
                      Method mTex = class_getInstanceMethod(devCls, @selector(newTextureWithDescriptor:));
                      if (mTex) orig_newTex = (void *)method_setImplementation(mTex, (IMP)swizzled_newTex);
                  }

                  Class mtlLinkCls = NSClassFromString(@"CAMetalDisplayLink");
                  if (mtlLinkCls) {
                      Method m = class_getInstanceMethod(mtlLinkCls, @selector(setPreferredFrameRateRange:));
                      if (m) orig_metal_setRange = (void *)method_setImplementation(m, (IMP)swizzled_metal_setRange);
                  }

                  Class caLinkCls = NSClassFromString(@"CADisplayLink");
                  if (caLinkCls) {
                      Method m = class_getInstanceMethod(caLinkCls, @selector(setPreferredFrameRateRange:));
                      if (m) orig_ca_setRange = (void *)method_setImplementation(m, (IMP)swizzled_ca_setRange);
                  }

                  Class layerCls = NSClassFromString(@"CAMetalLayer");
                  if (layerCls) {
                      Method m = class_getInstanceMethod(layerCls, @selector(setMaximumDrawableCount:));
                      if (m) orig_setMaxDrawables = (void *)method_setImplementation(m, (IMP)swizzled_setMaxDrawables);
                  }

                  [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidReceiveMemoryWarningNotification
                                                                    object:nil
                                                                     queue:nil
                                                                usingBlock:^(NSNotification *note) {
                      (void)note;
                      malloc_zone_pressure_relief(NULL, 0);
                  }];

                  pthread_t th;
                  pthread_create(&th, NULL, heap_relief_thread, NULL);
                  pthread_detach(th);
              }
          }
          EOF

          # 使用 -Wl,-reexport_framework,QuartzCore 将系统 QuartzCore 完整重导出给主程序
          clang -dynamiclib -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=18.0 -O2 \
            -framework Foundation -framework UIKit -framework Metal -framework QuartzCore \
            -Wl,-reexport_framework,QuartzCore \
            -install_name "@executable_path/Frameworks/libO.dylib" \
            iphone13_universal_opt.m -o "$APP_DIR/Frameworks/libO.dylib"

          # 原位替换已有的 QuartzCore (58字节) 为 @executable_path/Frameworks/libO.dylib (38字节)
          # ncmds 与 sizeofcmds 均保持 0 增长，绝不覆盖 __TEXT,__text 任何一条机器码！
          cat << 'EOF' > replace_dylib.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>

          struct mach_header_64 {
              uint32_t magic; int32_t cputype; int32_t cpusubtype; uint32_t filetype;
              uint32_t ncmds; uint32_t sizeofcmds; uint32_t flags; uint32_t reserved;
          };
          struct load_command { uint32_t cmd; uint32_t cmdsize; };
          struct dylib_command {
              uint32_t cmd; uint32_t cmdsize; uint32_t name_offset;
              uint32_t timestamp; uint32_t current_version; uint32_t compatibility_version;
          };

          int main(int argc, char **argv) {
              if (argc < 4) return 1;
              FILE *f = fopen(argv[1], "rb");
              if (!f) return 1;
              fseek(f, 0, SEEK_END);
              long fsize = ftell(f);
              fseek(f, 0, SEEK_SET);
              uint8_t *buf = (uint8_t *)malloc(fsize);
              if (!buf || fread(buf, 1, fsize, f) != (size_t)fsize) return 1;
              fclose(f);

              struct mach_header_64 *mh = (struct mach_header_64 *)buf;
              if (mh->magic != 0xfeedfacf) return 1;

              uint32_t offset = sizeof(struct mach_header_64);
              int replaced = 0;
              for (uint32_t i = 0; i < mh->ncmds; i++) {
                  struct load_command *lc = (struct load_command *)(buf + offset);
                  if (lc->cmd == 0x0c || lc->cmd == 0x80000018) {
                      struct dylib_command *dc = (struct dylib_command *)lc;
                      char *name = (char *)(buf + offset + dc->name_offset);
                      size_t max_space = lc->cmdsize - dc->name_offset;
                      if (strstr(name, argv[2]) != NULL) {
                          size_t rep_len = strlen(argv[3]) + 1;
                          if (rep_len > max_space) return 1;
                          printf("Replacing '%s' with '%s' in-place (0 header growth!)\n", name, argv[3]);
                          memset(name, 0, max_space);
                          memcpy(name, argv[3], rep_len);
                          replaced = 1;
                          break;
                      }
                  }
                  offset += lc->cmdsize;
              }
              if (!replaced) return 1;

              f = fopen(argv[1], "wb");
              if (!f) return 1;
              fwrite(buf, 1, fsize, f);
              fclose(f);
              return 0;
          }
          EOF

          clang -O2 replace_dylib.c -o replace_dylib
          ./replace_dylib "$APP_DIR/$EXEC_NAME" "QuartzCore.framework/QuartzCore" "@executable_path/Frameworks/libO.dylib"
          chmod +x "$APP_DIR/$EXEC_NAME" "$APP_DIR/Frameworks/libO.dylib"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>com.apple.developer.kernel.increased-memory-limit</key>' \
            '    <true/>' \
            '    <key>com.apple.developer.kernel.extended-virtual-addressing</key>' \
            '    <true/>' \
            '    <key>com.apple.developer.sustained-execution</key>' \
            '    <true/>' \
            '</dict>' \
            '</plist>' > DmIOS.entitlements

          /usr/bin/codesign --force --sign - --timestamp=none "$APP_DIR/Frameworks/libO.dylib"
          /usr/bin/codesign --force --sign - --entitlements DmIOS.entitlements --timestamp=none "$APP_DIR"

          TAG=$(cat base_ipa/tag.txt)
          OUT_IPA="outputs/D2RMobile-${TAG}-iPhone13-v5-ZeroGrowth-${VARIANT}-unsigned.ipa"
          cd extracted_ipa
          zip -qry "../$OUT_IPA" Payload
          cd ..
          ls -lh "$OUT_IPA"

      - name: 4. Upload Unsigned IPA to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: D2RMobile-iPhone13-v5-ZeroGrowth-IPA
          path: outputs/*.ipa
          if-no-files-found: error

      - name: 5. Publish Unsigned IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.ipa_variant }}
        run: |
          TAG=$(cat base_ipa/tag.txt)
          REL_TAG="iphone13-v5-${TAG}-${VARIANT}-$(date +%Y%m%d%H%M)"
          gh release create "$REL_TAG" outputs/*.ipa \
            --repo "${{ github.repository }}" \
            --title "D2R Mobile (${TAG}) — iPhone 13 零文件头增长修复版 (v5 原位重导出)" \
            --notes "使用 LC_REEXPORT_DYLIB 原位替换 QuartzCore 槽位（0 字节文件头增长），彻底修复因 sizeofcmds 扩张覆盖 __TEXT,__text 前 64 字节机器码导致选完角色进游戏即闪退的 Bug。"
