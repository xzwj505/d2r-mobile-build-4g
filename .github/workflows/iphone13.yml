name: Build iPhone 13 Optimized IPA

on:
  workflow_dispatch:
    inputs:
      ipa_variant:
        description: "IPA 架构版本 (iPhone 13 必选 ios18)"
        required: true
        default: "ios18"
        type: choice
        options:
          - ios18
          - ios26

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Locate & Download Latest Base IPA
        env:
          VARIANT: ${{ inputs.ipa_variant }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p base_ipa extracted_ipa outputs
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/jiayx/d2r-mobile-build/releases?per_page=15" > base_ipa/releases.json

          if [ "$VARIANT" = "ios18" ]; then
            DOWNLOAD_URL=$(jq -r '[.[] | .assets[] | select(.name | endswith("-ios18.ipa")) | .browser_download_url][0]' base_ipa/releases.json)
            TAG=$(jq -r '[.[] | select(any(.assets[]; .name | endswith("-ios18.ipa"))) | .tag_name][0]' base_ipa/releases.json)
          else
            DOWNLOAD_URL=$(jq -r '[.[] | .assets[] | select((.name | endswith(".ipa")) and (.name | endswith("-ios18.ipa") | not)) | .browser_download_url][0]' base_ipa/releases.json)
            TAG=$(jq -r '[.[] | select(any(.assets[]; (.name | endswith(".ipa")) and (.name | endswith("-ios18.ipa") | not))) | .tag_name][0]' base_ipa/releases.json)
          fi

          echo "$TAG" > base_ipa/tag.txt
          curl -fL --retry 3 -o "base_ipa/base.ipa" "$DOWNLOAD_URL"
          unzip -q "base_ipa/base.ipa" -d extracted_ipa

      - name: 3. Compile & Inject Safe Metal Optimizer (Zero Memory Corruption)
        env:
          VARIANT: ${{ inputs.ipa_variant }}
        run: |
          set -euxo pipefail
          APP_DIR=$(find extracted_ipa/Payload -maxdepth 1 -name "*.app" | head -n 1)
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          # 先提取原包自带的 Entitlements 以便 100% 兼容 AltStore
          /usr/bin/codesign -d --entitlements :- "$APP_DIR" > Original.entitlements 2>/dev/null || true

          cat << 'EOF' > iphone13_universal_opt.m
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #include <CoreFoundation/CoreFoundation.h>
          #include <sys/sysctl.h>
          #include <mach/mach.h>
          #include <malloc/malloc.h>

          static int is_4gb_device(void) {
              static int s = -1;
              if (s < 0) {
                  uint64_t m = 0;
                  size_t l = sizeof(m);
                  if (sysctlbyname("hw.memsize", &m, &l, NULL, 0) == 0 && m > 0) {
                      s = (m <= (4ULL << 30) + (512ULL << 20)) ? 1 : 0;
                  } else {
                      s = 1;
                  }
              }
              return s;
          }

          static uint64_t phys_footprint_mb(void) {
              task_vm_info_data_t vi;
              mach_msg_type_number_t c = TASK_VM_INFO_COUNT;
              if (task_info(mach_task_self(), TASK_VM_INFO, (task_info_t)&vi, &c) == KERN_SUCCESS) {
                  return (uint64_t)(vi.phys_footprint >> 20);
              }
              return 0;
          }

          // 1. 拦截 MTLTextureDescriptor: 只读贴图关闭驱动锁追踪 + 渲染目标开启硬件无损压缩(带安全回退)
          static id<MTLTexture> (*orig_newTex)(id, SEL, MTLTextureDescriptor *);
          static id<MTLTexture> swizzled_newTex(id self, SEL _cmd, MTLTextureDescriptor *desc) {
              if (!desc || !orig_newTex) return orig_newTex ? orig_newTex(self, _cmd, desc) : nil;
              if (desc.storageMode == MTLStorageModePrivate) {
                  if (desc.usage == MTLTextureUsageShaderRead) {
                      desc.hazardTrackingMode = MTLHazardTrackingModeUntracked;
                  }
                  if ((desc.usage & MTLTextureUsageRenderTarget) != 0) {
                      @try {
                          desc.compressionType = MTLTextureCompressionTypeLossless;
                          id<MTLTexture> t = orig_newTex(self, _cmd, desc);
                          if (t) return t;
                      } @catch (NSException *e) {}
                      desc.compressionType = (MTLTextureCompressionType)0;
                  }
              }
              return orig_newTex(self, _cmd, desc);
          }

          // 2. 拦截 MTLResidencySet:
          //    (a) 阻止 >=64MB 的巨型零拷贝虚拟内存池整池锁死物理内存 (Metal 3 下已有 m3_buf_add 负责绑定)
          //    (b) 在 commit 时自动清理已被 serial_del 从 g_by_serial 释放的死贴图 (CFGetRetainCount <= 2)
          static void (*orig_rs_add)(id, SEL, id);
          static void (*orig_rs_remove)(id, SEL, id);
          static void (*orig_rs_commit)(id, SEL);

          static void swizzled_rs_add(id self, SEL _cmd, id alloc) {
              if (!alloc || !orig_rs_add) return;
              if (is_4gb_device() && [alloc conformsToProtocol:@protocol(MTLBuffer)]) {
                  id<MTLBuffer> buf = (id<MTLBuffer>)alloc;
                  if (buf.length >= (64ULL * 1024ULL * 1024ULL)) {
                      return;
                  }
              }
              orig_rs_add(self, _cmd, alloc);
          }

          static void swizzled_rs_commit(id self, SEL _cmd) {
              if (!orig_rs_commit) return;
              static uint32_t s_commit_cnt = 0;
              if ((++s_commit_cnt & 15) == 0 && orig_rs_remove && [self respondsToSelector:@selector(allAllocations)]) {
                  uint64_t mb = phys_footprint_mb();
                  if (mb > 1350) {
                      @autoreleasepool {
                          NSArray *allocs = [self performSelector:@selector(allAllocations)];
                          for (id a in allocs) {
                              // 存活贴图被 g_by_serial (+1)、ResidencySet (+1) 与 allocs (+1) 同时持有，引用计数 >= 3；
                              // 若引用计数 <= 2，说明 nvn_mtl.m 的 serial_del 已经将其销毁，仅剩驻留集泄漏持有
                              if (CFGetRetainCount((__bridge CFTypeRef)a) <= 2) {
                                  orig_rs_remove(self, @selector(removeAllocation:), a);
                                  if ([a respondsToSelector:@selector(setPurgeableState:)]) {
                                      [(id<MTLResource>)a setPurgeableState:MTLPurgeableStateEmpty];
                                  }
                              }
                          }
                      }
                      malloc_zone_pressure_relief(NULL, 0);
                  }
              }
              orig_rs_commit(self, _cmd);
          }

          static id (*orig_newRS)(id, SEL, id, NSError **);
          static id swizzled_newRS(id self, SEL _cmd, id desc, NSError **err) {
              id rs = orig_newRS ? orig_newRS(self, _cmd, desc, err) : nil;
              if (rs) {
                  static dispatch_once_t onceToken;
                  dispatch_once(&onceToken, ^{
                      Class rsCls = object_getClass(rs);
                      Method mAdd = class_getInstanceMethod(rsCls, @selector(addAllocation:));
                      Method mRem = class_getInstanceMethod(rsCls, @selector(removeAllocation:));
                      Method mCom = class_getInstanceMethod(rsCls, @selector(commit));
                      if (mRem) orig_rs_remove = (void *)method_getImplementation(mRem);
                      if (mAdd) orig_rs_add = (void *)method_setImplementation(mAdd, (IMP)swizzled_rs_add);
                      if (mCom) orig_rs_commit = (void *)method_setImplementation(mCom, (IMP)swizzled_rs_commit);
                  });
              }
              return rs;
          }

          // 3. 温控感知锁帧: 仅当机身发热达到 Fair/Serious 时自动平滑切入 30Hz 降温护航
          static void (*orig_metal_setRange)(id, SEL, CAFrameRateRange);
          static void swizzled_metal_setRange(id self, SEL _cmd, CAFrameRateRange range) {
              NSProcessInfoThermalState st = [[NSProcessInfo processInfo] thermalState];
              if (st >= NSProcessInfoThermalStateFair || range.preferred <= 30.0f) {
                  range = CAFrameRateRangeMake(30, 30, 30);
              }
              if (orig_metal_setRange) orig_metal_setRange(self, _cmd, range);
          }

          __attribute__((constructor))
          static void init_iphone13_safe_opt(void) {
              @autoreleasepool {
                  id<MTLDevice> dev = MTLCreateSystemDefaultDevice();
                  if (dev) {
                      Class devCls = object_getClass(dev);
                      Method mTex = class_getInstanceMethod(devCls, @selector(newTextureWithDescriptor:));
                      if (mTex) orig_newTex = (void *)method_setImplementation(mTex, (IMP)swizzled_newTex);

                      SEL rsSel = NSSelectorFromString(@"newResidencySetWithDescriptor:error:");
                      Method mRS = class_getInstanceMethod(devCls, rsSel);
                      if (mRS) orig_newRS = (void *)method_setImplementation(mRS, (IMP)swizzled_newRS);
                  }

                  Class mtlLinkCls = NSClassFromString(@"CAMetalDisplayLink");
                  if (mtlLinkCls) {
                      Method m = class_getInstanceMethod(mtlLinkCls, @selector(setPreferredFrameRateRange:));
                      if (m) orig_metal_setRange = (void *)method_setImplementation(m, (IMP)swizzled_metal_setRange);
                  }
              }
          }
          EOF

          clang -dynamiclib -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=18.0 -O2 \
            -framework Foundation -framework CoreFoundation -framework Metal -framework QuartzCore \
            -install_name "@executable_path/libiphone13_opt.dylib" \
            iphone13_universal_opt.m -o "$APP_DIR/libiphone13_opt.dylib"

          cat << 'EOF' > inject_dylib.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>

          struct mach_header_64 {
              uint32_t magic; int32_t cputype; int32_t cpusubtype; uint32_t filetype;
              uint32_t ncmds; uint32_t sizeofcmds; uint32_t flags; uint32_t reserved;
          };
          struct load_command { uint32_t cmd; uint32_t cmdsize; };
          struct dylib_command {
              uint32_t cmd; uint32_t cmdsize; uint32_t name_offset;
              uint32_t timestamp; uint32_t current_version; uint32_t compatibility_version;
          };

          int main(int argc, char **argv) {
              if (argc < 3) return 1;
              FILE *f = fopen(argv[1], "rb");
              if (!f) return 1;
              fseek(f, 0, SEEK_END);
              long fsize = ftell(f);
              fseek(f, 0, SEEK_SET);
              uint8_t *buf = (uint8_t *)malloc(fsize);
              if (!buf || fread(buf, 1, fsize, f) != (size_t)fsize) return 1;
              fclose(f);

              struct mach_header_64 *mh = (struct mach_header_64 *)buf;
              if (mh->magic != 0xfeedfacf) return 1;

              size_t name_len = strlen(argv[2]) + 1;
              uint32_t cmd_size = (uint32_t)((sizeof(struct dylib_command) + name_len + 7) & ~7);
              uint8_t new_cmd[256];
              memset(new_cmd, 0, sizeof(new_cmd));
              struct dylib_command *dc = (struct dylib_command *)new_cmd;
              dc->cmd = 0x80000018;
              dc->cmdsize = cmd_size;
              dc->name_offset = sizeof(struct dylib_command);
              dc->timestamp = 2;
              dc->current_version = 0x10000;
              dc->compatibility_version = 0x10000;
              memcpy(new_cmd + sizeof(struct dylib_command), argv[2], name_len);

              uint32_t offset = sizeof(struct mach_header_64);
              uint32_t last_off = offset, last_cmd = 0, last_sz = 0;
              for (uint32_t i = 0; i < mh->ncmds; i++) {
                  struct load_command *lc = (struct load_command *)(buf + offset);
                  last_off = offset; last_cmd = lc->cmd; last_sz = lc->cmdsize;
                  offset += lc->cmdsize;
              }
              if (last_cmd == 0x1d) {
                  uint8_t sig_copy[64];
                  memcpy(sig_copy, buf + last_off, last_sz);
                  memcpy(buf + last_off, new_cmd, cmd_size);
                  memcpy(buf + last_off + cmd_size, sig_copy, last_sz);
              } else {
                  memcpy(buf + offset, new_cmd, cmd_size);
              }
              mh->ncmds += 1;
              mh->sizeofcmds += cmd_size;

              f = fopen(argv[1], "wb");
              if (!f) return 1;
              fwrite(buf, 1, fsize, f);
              fclose(f);
              return 0;
          }
          EOF

          clang -O2 inject_dylib.c -o inject_dylib
          /usr/bin/codesign --remove-signature "$APP_DIR/$EXEC_NAME" || true
          ./inject_dylib "$APP_DIR/$EXEC_NAME" "@executable_path/libiphone13_opt.dylib"
          chmod +x "$APP_DIR/$EXEC_NAME" "$APP_DIR/libiphone13_opt.dylib"

          /usr/bin/codesign --force --sign - --timestamp=none "$APP_DIR/libiphone13_opt.dylib"
          if [ -s Original.entitlements ]; then
            /usr/bin/codesign --force --sign - --entitlements Original.entitlements --timestamp=none "$APP_DIR"
          else
            /usr/bin/codesign --force --sign - --timestamp=none "$APP_DIR"
          fi

          TAG=$(cat base_ipa/tag.txt)
          OUT_IPA="outputs/D2RMobile-${TAG}-iPhone13-SafeOpt-${VARIANT}-unsigned.ipa"
          cd extracted_ipa
          zip -qry "../$OUT_IPA" Payload
          cd ..
          ls -lh "$OUT_IPA"

      - name: 4. Upload Unsigned IPA to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: D2RMobile-iPhone13-SafeOpt-IPA
          path: outputs/*.ipa
          if-no-files-found: error

      - name: 5. Publish Unsigned IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.ipa_variant }}
        run: |
          TAG=$(cat base_ipa/tag.txt)
          REL_TAG="iphone13-safeopt-${TAG}-${VARIANT}-$(date +%Y%m%d%H%M)"
          gh release create "$REL_TAG" outputs/*.ipa \
            --repo "${{ github.repository }}" \
            --title "D2R Mobile (${TAG}) — iPhone 13 安全显存回收与温控优化版" \
            --notes "已移除会导致进营地闪退的 madvise 扫描，改为纯 Metal 驱动层驻留集死贴图回收 (MTLResidencySet GC)、跳过 64MB+ 巨型池强锁物理内存、渲染目标硬件无损压缩及原包 Entitlements 无损保留。"
